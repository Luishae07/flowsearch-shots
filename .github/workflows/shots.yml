name: shots
on:
  workflow_dispatch:
    inputs:
      all:
        description: "Redo every site, not only the new ones (true/false)"
        default: "false"
  push:
    paths: [sites.txt]
  schedule:
    - cron: "17 3 1 * *"
permissions:
  contents: read
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libjxl-tools imagemagick
      - run: node shoot.mjs
        env:
          SHOTS_KEY: ${{ secrets.SHOTS_KEY }}
          ALL: ${{ (github.event.inputs.all == 'true' || github.event_name == 'schedule') && '1' || '0' }}
